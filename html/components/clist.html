<div id="modal-clist" class="modal-overlay hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] justify-center items-center px-4">
    <div class="modal-content bg-[var(--surface)] border border-[var(--b-color)] rounded-2xl max-w-2xl w-full h-[75vh] p-6 md:p-8 relative flex flex-col animate-modal-in shadow-2xl">

        <!-- Nút Đóng -->
        <button onclick="closeModal('modal-clist')" aria-label="Close" class="btn-icon absolute top-5 right-5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

        <!-- Tiêu Đề Modal -->
        <div class="flex items-center justify-between pr-8 mb-2">
            <div>
                <h2 class="text-xl font-extrabold text-gradient uppercase tracking-wider font-display">Danh Sách So Sánh (C-List)</h2>
                <p class="text-xs text-[var(--text-sub)] mt-0.5">
                    Được lưu bền vững trên trình duyệt (Persistent Storage).
                </p>
            </div>
            <button onclick="clearCList()" class="text-xs text-red-500 hover:underline font-semibold flex items-center gap-1">
                Xóa tất cả
            </button>
        </div>

        <!-- Danh Sách Sản Phẩm -->
        <div id="clist-items" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar my-4">
            <!-- JS tự động render -->
        </div>

        <!-- Nút Thực Thi -->
        <div class="pt-4 border-t border-[var(--b-color)] mt-auto flex flex-col sm:flex-row gap-3">
            <button onclick="closeModal('modal-clist')" class="btn-secondary flex-1 py-2.5 text-xs font-bold uppercase">
                Tiếp tục xem
            </button>
            <button id="btn-run-compare" onclick="runCList()" class="btn-primary run-btn flex-1 py-2.5 text-xs font-bold uppercase">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/></svg>
                Chạy So Sánh (Run MCDM)
            </button>
        </div>
    </div>
</div>
